[project]
name = "data-analysis-backend"
version = "1.0.0"
requires-python = ">=3.11"

# ============================================================
# Ruff — Linter & Formatter
# ============================================================
[tool.ruff]
target-version = "py311"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "RUF",  # ruff-specific
]
ignore = [
    "S101",   # assert 允许在测试中使用
    "S105",   # 密钥硬编码误报（默认值场景）
    "B008",   # Depends() 在函数参数中是 FastAPI 惯例
    "A003",   # class attribute shadows builtin（id 等常见字段）
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"app/core/config.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ============================================================
# Pytest
# ============================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
addopts = "-v --tb=short"

# ============================================================
# Coverage
# ============================================================
[tool.coverage.run]
source = ["app"]
omit = [
    "app/services/llm/tools/setup.py",
    "*/alembic/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "pass",
]
